name: Publish to npm

# Runs when a GitHub release is published. Uses npm trusted publishing (OIDC):
# no NPM_TOKEN secret is needed, and provenance is attached automatically.
# One-time setup on npmjs.com: package settings -> Trusted publishing -> GitHub Actions,
# repository alexandrusavin/exectimer, workflow file publish.yml, environment npm.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - name: Use an npm that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm test
      - run: npm publish
